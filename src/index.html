<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Inventory</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb); --surface: var(--hub-surface, #fff);
      --border: var(--hub-border, #e5e7eb); --border-mid: var(--hub-border, #d1d5db);
      --text: var(--hub-text, #000000); --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #0d9488); --accent-hover: var(--hub-primary-hover, #0f766e);
      --accent-fg: var(--hub-primary-fg, #fff); --radius: var(--hub-radius, 8px);
      --shadow: 0 1px 3px rgba(15,23,42,.07);
    }
    body { min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px); line-height: 1.5; }
    .app { max-width: 820px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    h1 { font-size: 1.35rem; } h2 { font-size: 1rem; }
    .muted { color: var(--muted); } .tiny { font-size: .78rem; }
    .search { position: relative; margin-bottom: 14px; }
    .search input { width: 100%; padding: 11px 14px 11px 38px; border: 1.5px solid var(--border-mid); border-radius: 10px; font: inherit; background: var(--surface); color: var(--text); }
    .search input:focus { outline: none; border-color: var(--accent); }
    .search::before { content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: .9rem; opacity: .6; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .seg { display: inline-flex; gap: 2px; background: var(--border); padding: 3px; border-radius: 8px; }
    .seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 11px; border-radius: 6px; font: inherit; font-size: .8rem; font-weight: 700; cursor: pointer; }
    .seg button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    .group-head { font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 2px 8px; display: flex; align-items: center; gap: 6px; }
    .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); align-items: start; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .card:hover { border-color: var(--border-mid); box-shadow: 0 5px 14px rgba(15,23,42,.08); }
    .thumb { height: 120px; background: #f1f5f9 center/cover no-repeat; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #94a3b8; }
    .card-body { padding: 11px 12px; }
    .card-name { font-weight: 700; }
    .card-meta { color: var(--muted); font-size: .8rem; margin-top: 2px; }
    .loc-pill { display: inline-flex; align-items: center; gap: 4px; background: #ecfeff; color: #0e7490; border-radius: 999px; padding: 2px 8px; font-size: .74rem; font-weight: 700; margin-top: 6px; }
    .value { font-weight: 800; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 8px; padding: 8px 12px; font: inherit; font-size: .86rem; font-weight: 700; cursor: pointer; min-height: 38px; background: var(--accent); color: var(--accent-fg); }
    .btn:hover { background: var(--accent-hover); } .btn:disabled { opacity: .5; cursor: default; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-mid); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .btn-sm { min-height: 31px; padding: 5px 9px; font-size: .78rem; }
    .empty { text-align: center; padding: 40px 16px; color: var(--muted); }
    .error { background: #fee2e2; color: #b91c1c; padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }
    .detail-photo { width: 100%; max-height: 300px; object-fit: cover; border-radius: var(--radius); background: #f1f5f9; }
    .kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; margin: 12px 0; }
    .kv dt { color: var(--muted); font-size: .82rem; font-weight: 700; }
    .kv dd { font-size: .9rem; }
    .hist { border-top: 1px solid var(--border); padding-top: 6px; margin-top: 4px; }
    .hist-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: .85rem; }
    .back { margin-bottom: 10px; }
    .field { display: grid; gap: 4px; margin-bottom: 12px; }
    .two { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    label { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; }
    input, textarea, select { width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px; padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text); }
    textarea { min-height: 60px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    .upload-area { border: 2px dashed var(--border-mid); border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; font-size: .85rem; color: var(--muted); }
    .upload-area:hover { border-color: var(--accent); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal { background: var(--surface); border-radius: 12px; padding: 20px; width: 100%; max-width: 480px; max-height: 92vh; overflow: auto; box-shadow: 0 20px 50px rgba(15,23,42,.25); }
    .modal h3 { margin-bottom: 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    @media (max-width: 520px) { .two { grid-template-columns: 1fr; } .kv { grid-template-columns: 100px 1fr; } }
  </style>
  <base href="/run/home-inventory/">
</head>
<body>
<div class="app"><div id="root" class="empty">Loading…</div></div>

<script type="module">
import { esc, isAdult, hubConfirm, fmtMoney, formatRelativeDate, createFilesHelper, searchMatch } from "/hub-sdk.js";
import {
  CATEGORIES, dollars, toCents, searchableFields, totalValue, knownLocations, groupItems,
} from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB = window.__DB_URL ?? "";
const EVENTS_URL = window.__EVENTS_URL ?? "/api/events";
const APP_ID = window.__APP_ID ?? "home-inventory";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;
const files = createFilesHelper(window.__FILES_URL ?? "");

let members = [], me = null;
let items = [], valuations = [];
let query = "", groupBy = "location", selectedId = null, error = "", modalEl = null;

function nowIso() { return new Date().toISOString(); }
function uid(p) { return `${p}-${crypto.randomUUID()}`; }
function canEdit() { return isAdult(me); }

async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sql, params }) });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

async function loadMembers() {
  if (!CONTEXT) { members = [{ id: "demo-1", name: "Alex", role: "adult" }, { id: "demo-2", name: "Jordan", role: "adult" }]; }
  else { try { const res = await fetch(`${CONTEXT}?keys=family.members`); members = ((await res.json())["family.members"]) ?? []; } catch { members = []; } }
  me = HUB_MEMBER ?? members[0] ?? { id: "guest", name: "Guest", role: "adult" };
}

function seedDemo() {
  items = [
    { id: "i1", name: "MacBook Pro 16\"", category: "electronics", location: "Home office", brand: "Apple", model: "A2485", serial: "C02XL0THJGH7", value_cents: 249900, quantity: 1, notes: "AppleCare through 2027.", photo_id: "", purchased_at: "2023-11-02", created_by: "demo-1", created_by_name: "Alex", created_at: nowIso() },
    { id: "i2", name: "Emergency flashlight", category: "tools", location: "Kitchen — junk drawer", brand: "", model: "", serial: "", value_cents: 2500, quantity: 2, notes: "Batteries in the same drawer.", photo_id: "", purchased_at: "", created_by: "demo-2", created_by_name: "Jordan", created_at: nowIso() },
    { id: "i3", name: "Wedding ring", category: "jewelry", location: "Bedroom safe", brand: "", model: "", serial: "", value_cents: 480000, quantity: 1, notes: "Appraisal PDF filed with insurer.", photo_id: "", purchased_at: "2019-06-15", created_by: "demo-1", created_by_name: "Alex", created_at: nowIso() },
  ];
  valuations = [
    { id: "vh1", item_id: "i3", value_cents: 420000, note: "Original purchase", recorded_by: "demo-1", recorded_by_name: "Alex", recorded_at: "2019-06-15T00:00:00Z" },
    { id: "vh2", item_id: "i3", value_cents: 480000, note: "2024 reappraisal", recorded_by: "demo-1", recorded_by_name: "Alex", recorded_at: "2024-03-01T00:00:00Z" },
  ];
}

async function loadData() {
  if (!DB) { seedDemo(); return; }
  const it = await db("SELECT * FROM app_home_inventory__items ORDER BY name ASC");
  items = it.rows;
}

// Valuation history is append-only and only ever shown in one item's detail
// sheet, so it is fetched per item on first open instead of preloaded whole.
// The map caches the in-flight promise (not a done flag) so a second open
// during the fetch can't start a duplicate; merges dedup by id because a
// just-added valuation is already in the local array.
//
// A failed load keeps its entry. Clearing it here would spin: renderDetail
// re-arms the fetch on every render and re-renders when it settles, so a
// delete-on-failure turns one dropped request into an unbounded retry loop for
// as long as the sheet stays open. Instead the entry is dropped when the sheet
// CLOSES, which retries at most once per open and only ever because a person
// asked for it. The failure is surfaced rather than shown as an empty history —
// "no valuations recorded" is a claim this read is no longer entitled to make.
const valuationLoads = new Map();
let valuationError = "";
function loadValuationsFor(itemId) {
  let p = valuationLoads.get(itemId);
  if (!p) {
    p = db("SELECT * FROM app_home_inventory__valuations WHERE item_id = ? ORDER BY recorded_at ASC", [itemId])
      .then((res) => {
        const seen = new Set(valuations.map((v) => v.id));
        valuations = [...valuations, ...res.rows.filter((r) => !seen.has(r.id))];
        valuationError = "";
      })
      .catch(() => { valuationError = itemId; });
    valuationLoads.set(itemId, p);
  }
  return p;
}

async function init() {
  try { await Promise.all([loadMembers(), loadData()]); }
  catch (e) { error = e.message; }
  render();
}

function publish(type, payload) {
  fetch(EVENTS_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ source_app_id: APP_ID, type, payload }) }).catch(() => {});
}
function showError(msg) { error = msg; render(); }

/* ── modal ── */
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  const f = modalEl.querySelector("[data-autofocus]"); if (f) f.focus();
}
function closeModal() { modalEl?.remove(); modalEl = null; }

/* ── search / filter ── */
function matches(it) { return !query || searchMatch(query, searchableFields(it)); }

/* ── add / edit ── */
function itemModal(id) {
  const it = id ? items.find(x => x.id === id) : null;
  const catOpts = CATEGORIES.map(c => `<option value="${c}" ${it?.category === c ? "selected" : ""}>${c[0].toUpperCase() + c.slice(1)}</option>`).join("");
  const knownLocationList = knownLocations(items);
  const locOpts = knownLocationList.map(l => `<option value="${esc(l)}"></option>`).join("");
  const uploadHtml = window.__FILES_URL ? `
    <div class="field">
      <label>Photo</label>
      <label class="upload-area" for="f-photo">📷 ${it?.photo_id ? "Replace photo" : "Attach a photo"}</label>
      <input id="f-photo" type="file" accept="image/*" style="display:none">
      <img id="photo-preview" style="display:${it?.photo_id ? "block" : "none"};margin-top:8px;max-width:100%;border-radius:8px" src="${it?.photo_id ? esc(files.url(it.photo_id)) : ""}">
    </div>` : "";
  openModal(`
    <h3>${it ? "Edit item" : "Add item"}</h3>
    <form id="item-form" data-id="${it ? esc(it.id) : ""}">
      <div class="field"><label for="f-name">Name</label><input id="f-name" data-autofocus placeholder="e.g. Living room TV" value="${it ? esc(it.name) : ""}"></div>
      <div class="two">
        <div class="field"><label for="f-location">Where is it?</label><input id="f-location" list="f-location-list" placeholder="Room, shelf, drawer…" value="${it ? esc(it.location) : ""}" autocomplete="off"><datalist id="f-location-list">${locOpts}</datalist></div>
        <div class="field"><label for="f-category">Category</label><select id="f-category">${catOpts}</select></div>
      </div>
      <div class="two">
        <div class="field"><label for="f-value">Value (each)</label><input id="f-value" type="number" min="0" step="0.01" placeholder="0.00" value="${it && it.value_cents ? dollars(it.value_cents) : ""}"></div>
        <div class="field"><label for="f-qty">Quantity</label><input id="f-qty" type="number" min="1" step="1" value="${it ? esc(String(it.quantity || 1)) : "1"}"></div>
      </div>
      <div class="two">
        <div class="field"><label for="f-brand">Brand</label><input id="f-brand" value="${it ? esc(it.brand) : ""}"></div>
        <div class="field"><label for="f-model">Model</label><input id="f-model" value="${it ? esc(it.model) : ""}"></div>
      </div>
      <div class="two">
        <div class="field"><label for="f-serial">Serial #</label><input id="f-serial" value="${it ? esc(it.serial) : ""}"></div>
        <div class="field"><label for="f-purchased">Purchased</label><input id="f-purchased" type="date" value="${it ? esc(it.purchased_at) : ""}"></div>
      </div>
      <div class="field"><label for="f-notes">Notes</label><textarea id="f-notes" placeholder="Warranty, condition, where the receipt lives…">${it ? esc(it.notes) : ""}</textarea></div>
      ${uploadHtml}
      <div class="modal-actions"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="submit" class="btn">${it ? "Save" : "Add item"}</button></div>
    </form>`);
  const fileInput = document.getElementById("f-photo");
  if (fileInput) fileInput.addEventListener("change", () => {
    const f = fileInput.files?.[0]; if (!f) return;
    const pv = document.getElementById("photo-preview"); pv.src = URL.createObjectURL(f); pv.style.display = "block";
  });
}

async function submitItem(form) {
  const name = form["f-name"].value.trim(); if (!name) { form["f-name"].focus(); return; }
  const id = form.dataset.id;
  const btn = modalEl.querySelector(".btn[type=submit]"); btn.disabled = true; btn.textContent = "Saving…";
  const valueCents = toCents(form["f-value"].value);
  const vals = {
    name, location: form["f-location"].value.trim(), category: form["f-category"].value,
    value_cents: valueCents, quantity: Math.max(1, parseInt(form["f-qty"].value, 10) || 1),
    brand: form["f-brand"].value.trim(), model: form["f-model"].value.trim(),
    serial: form["f-serial"].value.trim(), purchased_at: form["f-purchased"].value, notes: form["f-notes"].value.trim(),
  };
  try {
    let photoId = id ? (items.find(x => x.id === id)?.photo_id ?? "") : "";
    const file = document.getElementById("f-photo")?.files?.[0];
    if (file) { const up = await files.upload(file); photoId = up.id; }

    if (id) {
      const it = items.find(x => x.id === id);
      const prevValue = it.value_cents;
      if (DB) await db(`UPDATE app_home_inventory__items SET name=?, location=?, category=?, value_cents=?, quantity=?, brand=?, model=?, serial=?, purchased_at=?, notes=?, photo_id=?, updated_at=? WHERE id=?`,
        [vals.name, vals.location, vals.category, vals.value_cents, vals.quantity, vals.brand, vals.model, vals.serial, vals.purchased_at, vals.notes, photoId, nowIso(), id]);
      Object.assign(it, vals, { photo_id: photoId });
      if (vals.value_cents !== prevValue) await addValuation(id, vals.value_cents, "Value updated");
    } else {
      const row = { id: uid("i"), ...vals, photo_id: photoId, created_by: me.id, created_by_name: me.name, created_at: nowIso() };
      if (DB) await db(`INSERT INTO app_home_inventory__items (id, name, location, category, value_cents, quantity, brand, model, serial, purchased_at, notes, photo_id, created_by, created_by_name, created_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
        [row.id, row.name, row.location, row.category, row.value_cents, row.quantity, row.brand, row.model, row.serial, row.purchased_at, row.notes, row.photo_id, row.created_by, row.created_by_name, row.created_at]);
      items = [...items, row];
      if (row.value_cents) await addValuation(row.id, row.value_cents, "Initial value");
      publish("home_inventory.item_added", { id: row.id, name: row.name });
    }
    closeModal(); render();
  } catch (e) { btn.disabled = false; btn.textContent = id ? "Save" : "Add item"; showError(e.message); }
}

async function addValuation(itemId, valueCents, note) {
  const row = { id: uid("vh"), item_id: itemId, value_cents: valueCents, note, recorded_by: me.id, recorded_by_name: me.name, recorded_at: nowIso() };
  if (DB) await db(`INSERT INTO app_home_inventory__valuations (id, item_id, value_cents, note, recorded_by, recorded_by_name, recorded_at) VALUES (?,?,?,?,?,?,?)`,
    [row.id, row.item_id, row.value_cents, row.note, row.recorded_by, row.recorded_by_name, row.recorded_at]);
  valuations = [...valuations, row];
}

function revalueModal(itemId) {
  const it = items.find(x => x.id === itemId);
  openModal(`
    <h3>Record a new value</h3>
    <p class="muted tiny" style="margin-bottom:12px">Adds to the append-only valuation history for “${esc(it.name)}”.</p>
    <form id="reval-form" data-id="${esc(itemId)}">
      <div class="field"><label for="rv-value">New value</label><input id="rv-value" type="number" min="0" step="0.01" data-autofocus value="${dollars(it.value_cents)}"></div>
      <div class="field"><label for="rv-note">Note</label><input id="rv-note" placeholder="e.g. Annual reappraisal"></div>
      <div class="modal-actions"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="submit" class="btn">Record</button></div>
    </form>`);
}
async function submitReval(form) {
  const id = form.dataset.id; const it = items.find(x => x.id === id);
  const valueCents = toCents(form["rv-value"].value);
  const btn = modalEl.querySelector(".btn[type=submit]"); btn.disabled = true; btn.textContent = "Saving…";
  try {
    await addValuation(id, valueCents, form["rv-note"].value.trim() || "Revalued");
    if (DB) await db(`UPDATE app_home_inventory__items SET value_cents=?, updated_at=? WHERE id=?`, [valueCents, nowIso(), id]);
    it.value_cents = valueCents;
    closeModal(); render();
  } catch (e) { btn.disabled = false; btn.textContent = "Record"; showError(e.message); }
}

async function deleteItem(id) {
  const it = items.find(x => x.id === id);
  if (!(await hubConfirm({ message: `Delete “${it?.name ?? "this item"}”?`, description: "Its valuation history is removed too.", destructive: true, confirmLabel: "Delete" }))) return;
  try {
    // One statement. `delete_cascades` removes the valuation history inside the
    // same transaction (the two-statement batch this replaces did that much),
    // and `delete_file_columns` reclaims the item's photo through the hub's
    // durable outbox — which the old trailing `files.delete(...).catch()` could
    // not: it fired after the row was already gone, so a closed tab or a failed
    // request leaked the bytes with nothing left to name them by. The batch form
    // now refuses this DELETE outright rather than skipping either half.
    if (DB) await db("DELETE FROM app_home_inventory__items WHERE id=?", [id]);
    items = items.filter(x => x.id !== id); valuations = valuations.filter(v => v.item_id !== id);
    selectedId = null; render();
  } catch (e) { showError(e.message); }
}

/* ── render ── */
function renderList() {
  const filtered = items.filter(matches);
  const total = totalValue(filtered);
  const { keys, groups } = groupItems(filtered, groupBy);
  return `
    <div class="topbar">
      <div><h1>📦 Home Inventory</h1><p class="muted tiny">${items.length} items · ${fmtMoney(totalValue(items))} total value</p></div>
      ${canEdit() ? `<button class="btn" data-add>Add item</button>` : ""}
    </div>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    <div class="search"><input id="search" placeholder="Search by name, location, serial…" value="${esc(query)}" autocomplete="off"></div>
    <div class="toolbar">
      <div class="seg">
        <button data-group="location" class="${groupBy === "location" ? "active" : ""}">By location</button>
        <button data-group="category" class="${groupBy === "category" ? "active" : ""}">By category</button>
      </div>
      ${query ? `<span class="tiny muted">${filtered.length} match${filtered.length === 1 ? "" : "es"} · ${fmtMoney(total)}</span>` : ""}
    </div>
    ${filtered.length ? keys.map(k => `
      <div class="group-head">${groupBy === "location" ? "📍" : "🏷️"} ${esc(k)} <span class="muted" style="font-weight:600">· ${groups[k].length}</span></div>
      <div class="grid">${groups[k].map(renderCard).join("")}</div>
    `).join("") : `<div class="empty">${items.length ? "No items match your search." : "Nothing catalogued yet. Add your first item."}</div>`}
  `;
}

function renderCard(it) {
  const thumb = it.photo_id
    ? `<div class="thumb" style="background-image:url('${esc(files.url(it.photo_id))}')"></div>`
    : "";
  return `
    <article class="card" data-open="${esc(it.id)}">
      ${thumb}
      <div class="card-body">
        <div class="card-name">${esc(it.name)}</div>
        <div class="card-meta">${esc(it.category)}${it.quantity > 1 ? ` · ×${esc(String(it.quantity))}` : ""}${it.value_cents ? ` · <span class="value">${esc(fmtMoney(it.value_cents))}</span>` : ""}</div>
        ${it.location ? `<span class="loc-pill">📍 ${esc(it.location)}</span>` : ""}
      </div>
    </article>`;
}

function renderDetail() {
  const it = items.find(x => x.id === selectedId);
  if (!it) { selectedId = null; return renderList(); }
  if (DB && !valuationLoads.has(it.id)) loadValuationsFor(it.id).then(render);
  const hist = valuations.filter(v => v.item_id === it.id).sort((a, b) => b.recorded_at.localeCompare(a.recorded_at));
  return `
    <button class="btn btn-ghost btn-sm back" data-back>← Back</button>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    <div class="card" style="cursor:default;padding:16px">
      ${it.photo_id ? `<img class="detail-photo" src="${esc(files.url(it.photo_id))}" alt="">` : ""}
      <div class="topbar" style="margin-top:${it.photo_id ? "12px" : "0"}">
        <div><h1 style="font-size:1.2rem">${esc(it.name)}</h1><span class="loc-pill">📍 ${esc(it.location || "No location set")}</span></div>
        ${it.value_cents ? `<div style="text-align:right"><div class="value" style="font-size:1.2rem">${esc(fmtMoney(it.value_cents))}</div>${it.quantity > 1 ? `<div class="tiny muted">each · ×${esc(String(it.quantity))}</div>` : ""}</div>` : ""}
      </div>
      <dl class="kv">
        <dt>Category</dt><dd>${esc(it.category)}</dd>
        ${it.brand || it.model ? `<dt>Make / model</dt><dd>${esc([it.brand, it.model].filter(Boolean).join(" "))}</dd>` : ""}
        ${it.serial ? `<dt>Serial #</dt><dd>${esc(it.serial)}</dd>` : ""}
        ${it.purchased_at ? `<dt>Purchased</dt><dd>${esc(it.purchased_at)}</dd>` : ""}
        ${it.notes ? `<dt>Notes</dt><dd>${esc(it.notes)}</dd>` : ""}
        <dt>Added by</dt><dd>${esc(it.created_by_name)}</dd>
      </dl>
      ${canEdit() ? `<div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm" data-edit="${esc(it.id)}">Edit</button>
        <button class="btn btn-ghost btn-sm" data-reval="${esc(it.id)}">Record new value</button>
        <button class="btn btn-danger btn-sm" data-del="${esc(it.id)}">Delete</button>
      </div>` : ""}
      <h2 style="margin:16px 0 4px;font-size:.95rem">Valuation history</h2>
      <div class="hist">
        ${hist.length ? hist.map(v => `<div class="hist-row"><span><strong>${esc(fmtMoney(v.value_cents))}</strong> ${v.note ? `<span class="muted">— ${esc(v.note)}</span>` : ""}</span><span class="muted tiny">${esc(formatRelativeDate(v.recorded_at))}</span></div>`).join("") : valuationError === it.id ? `<div class="tiny muted" style="padding:8px 0">Could not load the valuation history. Go back and reopen to try again.</div>` : `<div class="tiny muted" style="padding:8px 0">No valuation records yet.</div>`}
      </div>
    </div>`;
}

function render() {
  const root = document.getElementById("root");
  root.className = "";
  const focusSearch = document.activeElement?.id === "search";
  const caret = focusSearch ? document.activeElement.selectionStart : null;
  root.innerHTML = selectedId ? renderDetail() : renderList();
  if (focusSearch) { const s = document.getElementById("search"); if (s) { s.focus(); if (caret != null) s.setSelectionRange(caret, caret); } }
}

document.addEventListener("input", e => {
  if (e.target.id === "search") { query = e.target.value; render(); }
});

document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-open]");
  if (!t) return;
  if (t.dataset.open) { selectedId = t.dataset.open; error = ""; render(); return; }
  if (t.dataset.back !== undefined) {
    // Closing is the retry boundary: drop a failed load so reopening refetches,
    // while a load that succeeded stays cached.
    if (valuationError) { valuationLoads.delete(valuationError); valuationError = ""; }
    selectedId = null; error = ""; render(); return;
  }
  if (t.dataset.close !== undefined) { closeModal(); return; }
  if (t.dataset.group) { groupBy = t.dataset.group; render(); return; }
  if (t.dataset.add !== undefined) return itemModal();
  if (t.dataset.edit) return itemModal(t.dataset.edit);
  if (t.dataset.reval) return revalueModal(t.dataset.reval);
  if (t.dataset.del) return deleteItem(t.dataset.del);
});

document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "item-form") submitItem(e.target);
  else if (e.target.id === "reval-form") submitReval(e.target);
});

init();
</script>
</body>
</html>
